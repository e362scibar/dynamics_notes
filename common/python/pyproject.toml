[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamics-common"
version = "0.1.0"
description = "Shared helpers for the dynamics_notes repository."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "latex2mathml>=3.77",
    "lxml>=6.1",
    "mathml2omml-as>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=9.2"]

[tool.setuptools.packages.find]
include = ["dynamics_common*"]
